version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_local
    ports:
      # Mappiamo la porta standard 6333 (HTTP) su una non standard
      # Mappiamo la porta standard 6334 (gRPC) su una non standard
      # Specificando 0.0.0.0 garantiamo che siano esposte su tutte le interfacce dell'host
      - "0.0.0.0:${QDRANT_HTTP_PORT:-7333}:6333"
      - "0.0.0.0:${QDRANT_GRPC_PORT:-7334}:6334"
    volumes:
      - ./.qdrant_data:/qdrant/storage
    restart: unless-stopped
    # Qdrant di default ascolta già su 0.0.0.0 all'interno del container

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    ports:
      # Mappiamo la porta standard 11434 su una non standard
      - "0.0.0.0:${OLLAMA_PORT:-12434}:11434"
    volumes:
      - ./.ollama_data:/root/.ollama
    # Passiamo la GPU integrata (AMD Strix Halo / Radeon 8060S) al container
    # per l'inferenza via Vulkan (RADV). Il render node è sufficiente per il compute.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "987"
      - "983"
    environment:
      # Configurazione necessaria affinché Ollama ascolti su 0.0.0.0 all'interno del container
      # altrimenti di default ascolterebbe solo su 127.0.0.1 (localhost)
      - OLLAMA_HOST=0.0.0.0
      # Forza l'uso del runtime Vulkan (GPU integrata AMD senza ROCm dedicato)
      - OLLAMA_VULKAN=true
      # Abilita l'inferenza sulla GPU integrata (Radeon 8060S / Strix Halo)
      - OLLAMA_IGPU_ENABLE=1
    restart: unless-stopped

  # Questo container ausiliario serve esclusivamente a lanciare il comando
  # di pull del modello una volta che il servizio "ollama" è partito.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_model_pull
    depends_on:
      - ollama
    environment:
      # Indichiamo a questo container di collegarsi all'host dell'altro container "ollama"
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_MODEL:-embeddinggemma} && ollama pull ${MEM0_CHAT_MODEL:-gemma4:e2b}"

  # Server MCP di Mem0: espone i tool di memoria a OpenCode usando
  # la libreria mem0ai, puntando a Ollama (LLM + embedder) e Qdrant (vector store).
  mem0:
    build: ./mem0
    container_name: mem0_mcp
    ports:
      - "0.0.0.0:${MEM0_PORT:-8090}:8000"
    depends_on:
      - ollama
      - qdrant
    environment:
      # Embedder: modello locale Ollama per le embedding (768-dim)
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-embeddinggemma}
      # LLM: DeepSeek nativo per estrazione memoria
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Qdrant vector store
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=mem0_memories
    volumes:
      - ./.mem0_data:/data
    restart: unless-stopped


